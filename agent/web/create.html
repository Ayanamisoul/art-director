<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Создать презентацию · Арт-директор</title>
  <link rel="stylesheet" href="/static/create.css">
  <script src="/static/create.js" defer></script>
</head>
<body>
  <header>
    <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span>Арт-директор</a>
    <a href="/workspace">Чаты и лендинги <span aria-hidden="true">↗</span></a>
  </header>
  <main>
    <h1>Создать презентацию</h1>
    <p class="intro">Опишите задачу своими словами. Можно приложить образец оформления или начать с чистого листа.</p>
    <form id="creator" action="/api/create-presentation" method="post" enctype="multipart/form-data">
      <fieldset id="inputs">
        <label for="brief">О чём презентация?</label>
        <textarea id="brief" name="brief" rows="5" required placeholder="Например, объясни первокурсникам, как работает память компьютера. На 8 слайдах, с примерами."></textarea>
        <label for="template">Шаблон <span>по желанию</span></label>
        <div class="attachment" id="drop">
          <input type="file" name="template" id="template" accept=".pptx,.pdf">
          <div aria-hidden="true"><b id="filename">Выберите или перетащите файл</b><small>PowerPoint (.pptx) или PDF</small></div>
        </div>
        <button type="button" id="remove" class="quiet" hidden>Убрать шаблон</button>
        <button type="submit" id="submit">Создать презентацию <span aria-hidden="true">→</span></button>
      </fieldset>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="result" hidden aria-labelledby="result-title">
      <h2 id="result-title"></h2>
      <p id="count"></p>
      <ul id="issues" hidden></ul>
      <div class="actions"><a id="download" class="primary" download>Скачать PowerPoint</a><a id="edit">Посмотреть слайды</a><a id="chat">Попросить правки</a></div>
    </section>
  </main>
</body>
</html>
