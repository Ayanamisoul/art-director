<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Редактор презентации — Арт-директор</title>
<link rel="stylesheet" href="/static/ui.css">
<link rel="stylesheet" href="/static/editor.css">
</head>
<body>
<header class="site-header">
  <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span>Арт-директор</a>
  <nav class="site-nav" aria-label="Основная навигация"><a href="/">Создать</a><a href="/workspace">Чаты и лендинги</a><span aria-current="page">Редактор</span></nav>
</header>
<section class="editor-bar" aria-label="Действия с презентацией">
  <h1>Редактор слайдов</h1>
  <span id="status" role="status"></span>
  <div><button class="primary" onclick="save()">Сохранить изменения</button>
  <button class="secondary" onclick="exportPdf(this)">Скачать PDF</button></div>
</section>
<div class="layout">
  <div class="slides-col">
    <div class="meta">
      <label for="p-title">Название презентации</label><input id="p-title">
      <label for="p-subtitle">Подзаголовок</label><input id="p-subtitle">
      <label for="p-accent" id="accent-label">Акцентный цвет</label><input id="p-accent" type="color">
    </div>
    <div class="slides" id="slides"></div>
    <div class="add-row"><button class="add-btn" onclick="addSlide()">+ Добавить слайд</button></div>
  </div>
  <section class="canvas" aria-label="Предпросмотр"><h2>Предпросмотр</h2><div class="preview" id="preview"></div></section>
</div>
<script>
const name = decodeURIComponent(location.pathname.split('/').pop());
const deckUrl = '/api/presentation/' + encodeURIComponent(name);
let data = { title: '', subtitle: '', slides: [], theme: {} };
let ASSETS = [];
let sourceFields = new Map();
let dirty = false;
let saving = false;
let editVersion = 0;

function changed() {
  dirty = true;
  editVersion++;
  document.getElementById('status').textContent = 'Есть несохранённые изменения';
  if (!data.theme?.template) renderPreview();
}

const KINDS = { title: 'Титульный', content: 'Текстовый', section: 'Раздел', closing: 'Финальный' };

async function load() {
  const ar = await fetch('/api/assets');
  ASSETS = (await ar.json()).files;
  const r = await fetch(deckUrl);
  if (!r.ok) { document.getElementById('status').textContent = 'не найдено: ' + name; return; }
  data = await r.json();
  if (data.theme?.template && data.slides.some(s => s.source_slide)) {
    const batches = new Set(data.slides.filter(s => s.source_slide)
      .map(s => 1 + 20 * Math.floor((s.source_slide - 1) / 20)));
    for (const start of batches) {
      const outline = await fetch('/api/templates/' + encodeURIComponent(data.theme.template)
        + '/outline?start=' + start + '&count=20')
        .then(r => r.ok ? r.json() : null).catch(() => null);
      for (const slide of outline?.slides || []) sourceFields.set(slide.source_slide, slide.fields);
    }
  }
  document.getElementById('p-title').value = data.title || '';
  document.getElementById('p-subtitle').value = data.subtitle || '';
  document.getElementById('p-accent').value = '#' + (data.theme?.accent || data.template_accent || '2E5E4E');
  const inheritsPalette = /\.pdf$/i.test(data.theme?.template || '') || data.slides.every(s => s.source_slide);
  if (inheritsPalette) {
    document.getElementById('accent-label').textContent = 'Цвета исходного шаблона';
    document.getElementById('p-accent').hidden = true;
  }
  for (const id of ['p-title', 'p-subtitle']) document.getElementById(id).oninput = changed;
  document.getElementById('p-accent').oninput = e => {
    data.theme = {...data.theme, accent: e.target.value.slice(1)};
    changed();
  };
  renderEditor(); await refreshPreview();
}

function addSlide() {
  data.slides.push({ kind: 'content', title: 'Новый слайд', bullets: [''] });
  renderEditor(); changed();
}
function delSlide(i) { data.slides.splice(i, 1); renderEditor(); changed(); }

function bulletText(items) {
  return items.flatMap(item => typeof item === 'string' ? [item]
    : [item.text, ...(item.sub || []).map(sub => '  ' + sub)]).join('\n');
}
function parseBullets(text) {
  const items = [];
  for (const line of text.split('\n')) {
    if (!line.trim()) continue;
    if (/^\s/.test(line) && items.length) items[items.length - 1].sub.push(line.trim());
    else items.push({text: line.trim(), sub: []});
  }
  return items;
}

function renderEditor() {
  const box = document.getElementById('slides');
  box.innerHTML = '';
  data.slides.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'slide';
    if (s.source_slide) {
      div.innerHTML = '<div class="row"><span class="num"></span><button class="del" title="Удалить слайд">×</button></div>';
      div.querySelector('.num').textContent = (i + 1) + ' · Исходный слайд ' + s.source_slide;
      div.querySelector('.del').onclick = () => delSlide(i);
      const original = sourceFields.get(s.source_slide) || {};
      for (const [key, value] of Object.entries({...original, ...s.template_fields})) {
        const label = document.createElement('label');
        label.className = 'field-label';
        label.textContent = 'Текстовое поле ' + key;
        const input = document.createElement('textarea');
        input.value = value;
        input.oninput = () => {
          s.template_fields ??= {};
          if (original[key] === input.value) delete s.template_fields[key];
          else s.template_fields[key] = input.value;
          changed();
        };
        label.appendChild(input);
        div.appendChild(label);
      }
      box.appendChild(div);
      return;
    }
    const isTitleLike = (s.kind === 'title' || s.kind === 'closing');
    const showBody = !isTitleLike || s.bullets?.length || s.cards?.length || s.stats?.length || s.image;
    div.innerHTML = `
      <div class="row"><span class="num">${i + 1}</span>
        <select>${Object.entries(KINDS).map(([k, v]) =>
          `<option value="${k}" ${s.kind === k ? 'selected' : ''}>${v}</option>`).join('')}</select>
        <button class="del" title="Удалить слайд">×</button></div>
      <input class="t" placeholder="Заголовок слайда">
      ${isTitleLike || s.subtitle ? '<input class="s" placeholder="Подзаголовок">' : ''}
      ${showBody ? '<textarea class="b" aria-label="Пункты и подпункты" placeholder="Один пункт в строке, подпункты с отступом"></textarea><select class="img" title="Изображение на слайд"></select>' : ''}`;
    div.querySelector('select').onchange = e => { s.kind = e.target.value; renderEditor(); changed(); };
    div.querySelector('.t').value = s.title || '';
    div.querySelector('.t').oninput = e => { s.title = e.target.value; changed(); };
    const sub = div.querySelector('.s');
    if (sub) {
      sub.value = s.subtitle || '';
      sub.oninput = e => { s.subtitle = e.target.value; changed(); };
    }
    const bul = div.querySelector('.b');
    if (bul) {
      bul.value = bulletText(s.bullets || []);
      bul.oninput = e => { s.bullets = parseBullets(e.target.value); changed(); };
      bul.hidden = Boolean((s.cards?.length || s.table) && !s.bullets?.length);
    }
    if (s.table) {
      const table = document.createElement('table');
      table.setAttribute('aria-label', 'Данные слайда');
      for (const [r, values] of [s.table.headers, ...s.table.rows].entries()) {
        const row = table.insertRow();
        values.forEach((value, c) => {
          const field = document.createElement('input');
          field.value = value;
          field.setAttribute('aria-label', r ? 'Строка ' + r + ', ' + s.table.headers[c] : 'Заголовок колонки ' + (c + 1));
          field.oninput = () => { values[c] = field.value; changed(); };
          row.insertCell().appendChild(field);
        });
      }
      div.appendChild(table);
    }
    for (const [group, caption, fields] of [
      [s.cards, 'Карточка', [['title', 'Заголовок'], ['text', 'Текст']]],
      [s.stats, 'Показатель', [['value', 'Значение'], ['caption', 'Подпись']]]
    ]) {
      for (const [index, item] of (group || []).entries()) {
        for (const [key, fieldName] of fields) {
          const label = document.createElement('label');
          label.className = 'field-label';
          label.textContent = caption + ' ' + (index + 1) + ' · ' + fieldName;
          const field = document.createElement(key === 'text' ? 'textarea' : 'input');
          field.value = item[key] || '';
          field.oninput = () => { item[key] = field.value; changed(); };
          label.appendChild(field);
          div.appendChild(label);
        }
      }
    }
    const imgSel = div.querySelector('.img');
    if (imgSel) {
      imgSel.add(new Option('— без изображения —', ''));
      for (const asset of ASSETS) imgSel.add(new Option(asset, asset));
      imgSel.value = s.image || '';
      imgSel.onchange = e => { s.image = e.target.value || undefined; changed(); };
    }
    div.querySelector('.del').onclick = () => delSlide(i);
    box.appendChild(div);
  });
}

async function refreshPreview() {
  const box = document.getElementById('preview');
  const info = await fetch(deckUrl + '/previews', {cache: 'no-store'})
    .then(r => r.ok ? r.json() : null).catch(() => null);
  if (!data.theme?.template && (dirty || !info?.ready)) { renderPreview(); return; }
  box.replaceChildren();
  const note = document.createElement('p');
  note.className = 'preview-note';
  note.textContent = info?.ready ? 'Слайды сохранённой версии' : 'Предпросмотр шаблона недоступен.';
  box.appendChild(note);
  if (!info?.ready) {
    const link = document.createElement('a');
    link.href = '/files/' + encodeURIComponent(name) + '.pptx';
    link.textContent = 'Открыть сохранённый PPTX';
    box.appendChild(link);
    return;
  }
  const revision = encodeURIComponent(info.version);
  for (let i = 1; i <= info.count; i++) {
    const img = document.createElement('img');
    img.alt = 'Слайд ' + i;
    img.src = '/previews/' + encodeURIComponent(name) + '/p' + i + '.png?v=' + revision;
    box.appendChild(img);
  }
}

function renderPreview() {
  const accent = document.getElementById('p-accent').value;
  const box = document.getElementById('preview');
  box.innerHTML = '';
  data.slides.forEach(s => {
    const div = document.createElement('div');
    if (s.table) {
      div.className = 'pv-slide pv-content';
      div.innerHTML = '<h3>' + esc(s.title) + '</h3><table>' + [s.table.headers, ...s.table.rows]
        .map(row => '<tr>' + row.map(value => '<td>' + esc(String(value)) + '</td>').join('') + '</tr>').join('') + '</table>';
    } else if (s.kind === 'title' || s.kind === 'closing') {
      div.className = 'pv-slide pv-title-slide';
      div.style.background = '#1A2E28';
      div.innerHTML = `<h2>${esc(s.title)}</h2><p>${esc(s.subtitle || '')}</p>`;
    } else if (s.kind === 'section') {
      div.className = 'pv-slide pv-section';
      div.style.background = accent;
      div.innerHTML = `<h2>${esc(s.title)}</h2>`;
    } else {
      const dense = (s.bullets || []).length > 4;
      const text = `<h3 style="color:${accent}">${esc(s.title)}</h3>
        <ul>${(s.bullets || []).map(b => {
          const details = b.sub || [];
          if (!details.length) return `<li>${esc(bt(b))}</li>`;
          return `<li><strong>${esc(bt(b))}</strong><ul>${details.map(v => `<li>${esc(v)}</li>`).join('')}</ul></li>`;
        }).join('')}</ul>`;
      div.className = 'pv-slide pv-content' + (dense ? ' dense' : '');
      div.innerHTML = `<div class="bar" style="background:${accent}"></div>` + (s.image
        ? `<div class="pv-flex"><div class="txt">${text}</div><img src="/assets/${encodeURIComponent(s.image)}"></div>`
        : text);
    }
    box.appendChild(div);
  });
}
function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
function bt(b) { return typeof b === 'string' ? b : (b && b.text ? b.text : ''); }

async function exportPdf(btn) {
  if (saving || (dirty && !await save()) || dirty) return;
  btn.textContent = 'Готовлю PDF…';
  try {
    const r = await fetch(deckUrl + '/pdf', { method: 'POST' });
    const res = await r.json();
    if (res.ok) { window.open(res.file, '_blank'); btn.textContent = 'Сохранить в PDF'; }
    else { btn.textContent = ' ' + (res.detail || 'ошибка'); }
  } catch (err) { btn.textContent = ' ' + err; }
}

async function save() {
  if (saving) return false;
  saving = true;
  const version = editVersion;
  data.title = document.getElementById('p-title').value;
  data.subtitle = document.getElementById('p-subtitle').value;
  const st = document.getElementById('status');
  try {
    const r = await fetch(deckUrl, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data),
    });
    const res = await r.json();
    if (res.ok) {
      dirty = editVersion !== version;
      if (!dirty) {
        const added = res.slides.length - data.slides.length;
        data.slides = res.slides;
        renderEditor();
        st.className = 'ok';
        st.textContent = added > 0 ? 'Сохранено. Слайдов после разбиения: ' + res.slides.length + ' · ' : 'Сохранено · ';
        const link = document.createElement('a');
        link.href = res.file;
        link.target = '_blank';
        link.textContent = 'открыть PPTX';
        st.appendChild(link);
      }
      await refreshPreview();
      return true;
    }
    st.className = 'err';
    st.textContent = 'Замечания: ' + (res.issues || [res.detail]).join('; ');
  } catch (err) {
    st.className = 'err';
    st.textContent = 'Не удалось сохранить: ' + err.message;
  } finally {
    saving = false;
  }
  return false;
}

load();
</script>
</body>
</html>
