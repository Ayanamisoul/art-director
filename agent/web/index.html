<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Арт-директор</title>
<style>
  :root { --bg: #14110f; --panel: #1e1a17; --accent: #d4a76a; --text: #ece5dd; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: var(--bg); color: var(--text); }
  .layout { display: grid; grid-template-columns: 1fr 280px; height: 100vh; }
  .chat { display: flex; flex-direction: column; }
  header { padding: 16px 24px; border-bottom: 1px solid #2c2620; display: flex; align-items: center; justify-content: space-between; }
  header h1 { margin: 0; font-size: 18px; color: var(--accent); }
  header select { background: var(--panel); color: var(--text); border: 1px solid #3a322b; border-radius: 8px; padding: 6px 10px; font-size: 13px; }
  #focusbar { display: none; padding: 8px 24px; background: #241f1a; border-bottom: 1px solid #3a322b; font-size: 13px; color: var(--text); }
  #focusbar.on { display: block; }
  #focusbar a { color: var(--accent); text-decoration: none; margin-left: 10px; }
  #focusbar a:hover { text-decoration: underline; }
  #messages { flex: 1; overflow-y: auto; padding: 24px; }
  .msg { max-width: 760px; margin: 0 auto 16px; padding: 12px 16px; border-radius: 12px; white-space: pre-wrap; line-height: 1.5; }
  .msg.user { background: #2c2620; }
  .msg.agent { background: var(--panel); border: 1px solid #2c2620; }
  .msg .tools { margin-top: 8px; font-size: 12px; color: #9a8f83; }
  .msg .tools summary { cursor: pointer; }
  .composer { display: flex; gap: 12px; padding: 16px 24px; border-top: 1px solid #2c2620; }
  .composer input { flex: 1; padding: 12px 16px; border-radius: 10px; border: 1px solid #3a322b; background: var(--panel); color: var(--text); font-size: 15px; }
  .composer button { padding: 12px 24px; border: none; border-radius: 10px; background: var(--accent); color: #14110f; font-weight: bold; cursor: pointer; }
  .composer button:disabled { opacity: .5; cursor: wait; }
  .tplrow { display: flex; align-items: center; gap: 8px; padding: 10px 24px 0; font-size: 12px; color: #9a8f83; flex-wrap: wrap; }
  .tplrow select { background: var(--panel); color: var(--text); border: 1px solid #3a322b; border-radius: 8px; padding: 5px 10px; font-size: 12px; max-width: 420px; }
  aside { border-left: 1px solid #2c2620; padding: 16px; overflow-y: auto; }
  aside h2 { font-size: 14px; color: var(--accent); margin-top: 0; }
  aside a.file-link { display: block; color: var(--text); text-decoration: none; padding: 8px 10px; font-size: 13px; word-break: break-all; }
  aside a.file-link:hover { background: var(--panel); border-radius: 8px; }
  a.edit-btn { display: inline-block; margin: 0 0 10px; padding: 6px 10px; border: 1px solid var(--accent); border-radius: 8px; color: var(--accent); text-decoration: none; font-size: 12px; text-align: center; }
  a.edit-btn:hover { background: var(--accent); color: #14110f; }
  a.chat-btn { display: inline-block; margin: 0 0 10px 6px; padding: 6px 10px; border: 1px solid #3a322b; border-radius: 8px; color: var(--text); text-decoration: none; font-size: 12px; cursor: pointer; background: none; }
  a.chat-btn:hover { border-color: var(--accent); color: var(--accent); }
  button.new-chat { display: block; width: 100%; margin: 0 0 12px; padding: 8px 10px; background: var(--accent); color: #14110f; border: none; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; }
  aside h2 { margin: 18px 0 8px; font-size: 14px; color: var(--accent); }
  .chat-item { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .chat-item a.title { flex: 1; color: var(--text); text-decoration: none; font-size: 12px; word-break: break-word; padding: 5px 6px; border-radius: 6px; }
  .chat-item a.title:hover { background: var(--panel); }
  .chat-item a.open { color: var(--accent); text-decoration: none; font-size: 14px; padding: 2px 4px; }
  .chat-item button.del { background: none; border: none; color: #9a8f83; cursor: pointer; font-size: 13px; padding: 2px 4px; }
  .chat-item button.del:hover { color: #e88; }
  a.edit-btn:hover { background: var(--accent); color: #14110f; }
  .hint { font-size: 12px; color: #9a8f83; margin-bottom: 12px; }
  /* предпросмотр презентации в чате — та же геометрия, что у PPTX (cqw от ширины слайда) */
  .pv-wrap { display: flex; flex-direction: column; gap: 14px; margin-top: 12px; align-items: stretch; }
  .pv-slide { flex: none; width: 100%; aspect-ratio: 16/9; border-radius: 6px; padding: 5.2%;
    container-type: inline-size; position: relative; overflow: hidden; box-shadow: 0 4px 18px rgba(0,0,0,.4);
    background: #fff; color: #2b2b2b; }
  .pv-title-slide { color: #fff; display: flex; flex-direction: column;
    justify-content: center; align-items: center; text-align: center; }
  .pv-section { display: flex; justify-content: center; align-items: center; color: #fff; }
  .pv-content { background: #fff; color: #2b2b2b; }
  .pv-content .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 1.35cqw; }
  .pv-content h3 { margin: 0 0 4cqw; font-size: 3.33cqw; font-weight: 700; }
  .pv-content ul { margin: 0; padding-left: 1.6cqw; }
  .pv-content li { font-size: 2.29cqw; margin-bottom: 1.46cqw; line-height: 1.35; }
  .pv-content.dense li { font-size: 1.87cqw; margin-bottom: 1cqw; }
  .pv-title-slide h2 { font-size: 4.58cqw; margin: 0 0 1.6cqw; }
  .pv-title-slide p { font-size: 2.08cqw; opacity: .85; }
  .pv-flex { display: flex; gap: 3.5cqw; height: 100%; align-items: flex-start; }
  .pv-flex .txt { flex: 1 1 55%; min-width: 0; }
  .pv-flex img { flex: 0 1 39%; max-height: 78%; object-fit: contain; border-radius: .5cqw; }
  iframe.landing-pv { width: 100%; aspect-ratio: 16/10; border: none; border-radius: 6px; background: #fff; margin-top: 10px; }
  .pv-shot { display: block; width: 100%; border-radius: 6px; box-shadow: 0 4px 18px rgba(0,0,0,.4); margin-bottom: 4px; }
  .pv-src { display: block; font-size: 11px; color: #9a8f83; margin-top: 4px; }
  a.big-edit-btn { display: inline-block; margin-top: 10px; padding: 8px 18px; background: var(--accent); color: #14110f; border-radius: 8px; text-decoration: none; font-size: 13px; font-weight: bold; }
  .upload-btn { display: block; width: 100%; margin-bottom: 8px; padding: 8px 10px; background: none; border: 1px dashed #3a322b; border-radius: 8px; color: var(--text); font-size: 12px; cursor: pointer; text-align: center; }
  .upload-btn:hover { border-color: var(--accent); color: var(--accent); }
  /* зона перетаскивания файлов */
  #dropzone { position: fixed; inset: 0; z-index: 100; display: none;
    align-items: center; justify-content: center; flex-direction: column; gap: 10px;
    background: rgba(20, 17, 15, .88); border: 3px dashed var(--accent); border-radius: 12px;
    color: var(--accent); font-size: 22px; font-weight: bold; pointer-events: none; }
  #dropzone.on { display: flex; }
  #dropzone small { color: var(--text); font-weight: normal; font-size: 13px; opacity: .8; }
  .msg.agent.upload { background: #24201c; border-color: #3a322b; font-size: 13px; color: #c9c0b6; }
  .msg.agent.upload.err { color: #e88; border-color: #5a3a3a; }
</style>
</head>
<body>
<div class="layout">
  <div id="dropzone">⬇ Брось файлы сюда<small>картинки → изображения для презы · .pptx → шаблон презентации</small></div>
  <div class="chat">
    <header>
      <h1>Арт-директор</h1>
      <select id="backend">
        <option value="ollama">Локальная Qwen 7B</option>
        <option value="xkiro" selected>xkiro · Mistral Large</option>
        <option value="zai">Z.ai · GLM 5.3 Flash</option>
      </select>
    </header>
    <div id="focusbar"></div>
    <div id="messages"></div>
    <div class="tplrow"><span>Формат:</span><select id="outformat">
        <option value="">Авто — решает модель</option>
        <option value="presentation">Презентация (.pptx)</option>
        <option value="landing">Лендинг (сайт)</option>
      </select><span>Шаблон:</span><select id="template"><option value="">Авто — самый свежий загруженный</option></select></div>
    <form class="composer" id="form">
      <input id="input" placeholder="Например: сделай презентацию по железу для новичков по моему шаблону" autocomplete="off">
      <button id="send" type="submit">Отправить</button>
    </form>
  </div>
  <aside>
    <h2>Файлы</h2>
    <button class="new-chat" onclick="location.href='/'">🆕 Новый чат</button>
    <div class="hint">Всё сохраняется локально на этом компьютере.</div>
    <button class="upload-btn" onclick="document.getElementById('up-img').click()">📷 Загрузить изображение</button>
    <button class="upload-btn" onclick="document.getElementById('up-tpl').click()">📐 Загрузить шаблон (.pptx или .pdf)</button>
    <input type="file" id="up-img" accept="image/*" multiple hidden>
    <input type="file" id="up-tpl" accept=".pptx,.pdf" hidden>
    <h2>Чаты</h2>
    <div id="chats"></div>
    <h2>Файлы</h2>
  </aside>
</div>
<script>
let sessionId = null;
let presentation = null;
const messagesEl = document.getElementById('messages');
const filesEl = document.getElementById('files');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');

function addMsg(role, text, tools, validation, saved) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  if (validation && validation.issues && validation.issues.length) {
    const v = document.createElement('div');
    v.className = 'tools';
    v.textContent = (validation.ok ? '✅ проверено судьёй' : '⚠ судья: ' + validation.issues.join('; '));
    div.appendChild(v);
  }
  if (tools && tools.length) {
    const det = document.createElement('details');
    det.className = 'tools';
    det.innerHTML = '<summary>⚙ вызовы инструментов: ' + tools.length + '</summary>';
    const pre = document.createElement('pre');
    pre.textContent = tools.join('\n');
    det.appendChild(pre);
    div.appendChild(det);
  }
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  if (saved && saved.presentation) renderSlidesPreview(div, saved.presentation);
  if (saved && saved.html) renderHtmlPreview(div, saved.html);
  return div;
}

function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

async function renderSlidesPreview(container, name) {
  const r = await fetch('/api/presentation/' + encodeURIComponent(name));
  if (!r.ok) return;
  const data = await r.json();
  const accent = '#' + ((data.theme && data.theme.accent) || '2E5E4E');
  const wrap = document.createElement('div');
  wrap.className = 'pv-wrap';
  // настоящие рендеры слайдов (если готовы) вместо CSS-схемы — они показывают
  // реальный дизайн шаблона, как в PowerPoint
  const pv = await fetch('/api/presentation/' + encodeURIComponent(name) + '/previews')
    .then(x => x.json()).catch(() => ({ready: false}));
  if (pv.ready) {
    for (let i = 1; i <= pv.count; i++) {
      const img = document.createElement('img');
      img.className = 'pv-shot';
      img.loading = 'lazy';
      img.src = '/previews/' + encodeURIComponent(name) + '/p' + i + '.png';
      wrap.appendChild(img);
    }
    const src = document.createElement('span');
    src.className = 'pv-src';
    src.textContent = 'рендер из файла .pptx';
    wrap.appendChild(src);
  } else {
    data.slides.forEach(s => {
      const d = document.createElement('div');
      if (s.kind === 'title' || s.kind === 'closing') {
        d.className = 'pv-slide pv-title-slide';
        d.style.background = '#1A2E28';
        d.innerHTML = `<h2>${esc(s.title)}</h2><p>${esc(s.subtitle || '')}</p>`;
      } else if (s.kind === 'section') {
        d.className = 'pv-slide pv-section';
        d.style.background = accent;
        d.innerHTML = `<h2>${esc(s.title)}</h2>`;
      } else {
        const dense = (s.bullets || []).length > 4;
        const text = `<h3 style="color:${accent}">${esc(s.title)}</h3>
          <ul>${(s.bullets || []).map(b => `<li>${esc(b)}</li>`).join('')}</ul>`;
        d.className = 'pv-slide pv-content' + (dense ? ' dense' : '');
        d.innerHTML = `<div class="bar" style="background:${accent}"></div>` + (s.image
          ? `<div class="pv-flex"><div class="txt">${text}</div><img src="/assets/${encodeURIComponent(s.image)}"></div>`
          : text);
      }
      wrap.appendChild(d);
    });
  }
  container.appendChild(wrap);
  const btn = document.createElement('a');
  btn.className = 'big-edit-btn';
  btn.href = '/editor/' + encodeURIComponent(name);
  btn.textContent = '✏️ Открыть в редакторе';
  container.appendChild(btn);
}

function renderHtmlPreview(container, name) {
  const f = document.createElement('iframe');
  f.className = 'landing-pv';
  f.src = '/files/' + encodeURIComponent(name) + '.html';
  container.appendChild(f);
}

async function refreshFiles() {
  const r = await fetch('/api/files');
  const data = await r.json();
  filesEl.innerHTML = '';
  data.files.forEach(name => {
    const a = document.createElement('a');
    a.className = 'file-link';
    a.href = '/files/' + encodeURIComponent(name);
    a.textContent = name;
    a.target = '_blank';
    filesEl.appendChild(a);
    if (name.endsWith('.pptx')) {
      const base = name.replace(/\.pptx$/, '');
      const edit = document.createElement('a');
      edit.className = 'edit-btn';
      edit.href = '/editor/' + encodeURIComponent(base);
      edit.textContent = '✏️ Редактировать';
      filesEl.appendChild(edit);
      const chat = document.createElement('a');
      chat.className = 'chat-btn';
      chat.textContent = '💬 чат';
      chat.onclick = () => goChat(base);
      filesEl.appendChild(chat);
    }
  });
}

function setPresentation(name) {
  presentation = name;
  const bar = document.getElementById('focusbar');
  if (!name) { bar.className = ''; bar.innerHTML = ''; return; }
  bar.className = 'on';
  bar.innerHTML = '💬 Правим презентацию: <b>' + esc(name) + '</b>' +
    '<a href="/editor/' + encodeURIComponent(name) + '">✏️ открыть в редакторе</a>';
  input.placeholder = 'Например: поменяй заголовок второго слайда на «…» или добавь слайд про цены';
}

async function goChat(name) {
  const r = await fetch('/api/session/for-presentation', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name}),
  });
  const data = await r.json();
  location.href = '/?session=' + encodeURIComponent(data.id);
}

// --- восстановление чата по ссылке ?session=<id> (кнопка «💬 чат» в панели) ---
const restoreId = new URLSearchParams(location.search).get('session');
if (restoreId) restoreSession(restoreId);

async function restoreSession(id) {
  try {
    const r = await fetch('/api/session/' + encodeURIComponent(id));
    if (!r.ok) return;
    const data = await r.json();
    sessionId = data.id;
    setPresentation(data.presentation);
    const sel = document.getElementById('backend');
    if (data.backend && sel.querySelector('option[value="' + data.backend + '"]')) sel.value = data.backend;
    for (const m of data.messages) {
      if (m.role === 'system' || m.role === 'tool') continue;
      if (m.role === 'user') addMsg('user', m.content);
      else if (m.role === 'assistant' && m.content) addMsg('agent', m.content);
    }
    // предпросмотр последнего сохранённого результата этого чата
    for (let i = data.messages.length - 1; i >= 0; i--) {
      const m = data.messages[i];
      if (m.role !== 'assistant' || !m.tool_calls) continue;
      let presName = null, htmlName = null;
      for (const call of m.tool_calls) {
        try {
          const args = JSON.parse(call.function.arguments || '{}');
          if (call.function.name === 'save_presentation') presName = args.name;
          if (call.function.name === 'save_html') htmlName = args.name;
        } catch (_) {}
      }
      if (presName || htmlName) {
        // сервер сохраняет под слагом (пробелы/знаки -> _), зеркало _safe_name
        const slug = s => String(s).replace(/[^\p{L}\p{N}_-]/gu, '_');
        const anchor = addMsg('agent', '— последний результат этого чата:');
        if (presName) renderSlidesPreview(anchor, slug(presName));
        if (htmlName) renderHtmlPreview(anchor, slug(htmlName));
        break;
      }
    }
  } catch (err) {
    console.error('не удалось восстановить сессию:', err);
  }
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  sendBtn.disabled = true;
  addMsg('user', text);
  const thinking = addMsg('agent', 'Думаю…');
  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text, session_id: sessionId, backend: document.getElementById('backend').value,
        template: document.getElementById('template').value,
        output_format: document.getElementById('outformat').value}),
    });
    const data = await r.json();
    sessionId = data.session_id;
    if (data.presentation) setPresentation(data.presentation);
    thinking.remove();
    refreshTemplates();
    if (data.error) addMsg('agent', 'Ошибка: ' + data.error, data.tools);
    else addMsg('agent', data.answer, data.tools, data.validation, data.saved);
    refreshFiles();
  } catch (err) {
    thinking.textContent = 'Ошибка соединения: ' + err;
  }
  sendBtn.disabled = false;
  input.focus();
});

refreshFiles();

// ---------- выбор шаблона презентаций ----------
async function refreshTemplates() {
  const r = await fetch('/api/templates');
  const data = await r.json();
  const sel = document.getElementById('template');
  const current = sel.value;
  sel.innerHTML = '<option value="">Авто — самый свежий загруженный</option>' +
    data.files.map(f => '<option value="' + esc(f) + '">' + esc(f) + '</option>').join('');
  sel.value = current;
}
document.getElementById('template').addEventListener('change', async e => {
  await fetch('/api/templates/preferred', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name: e.target.value}),
  });
});
refreshTemplates();

// ---------- загрузка файлов: кнопки, drag&drop, вставка из буфера ----------
document.getElementById('up-img').addEventListener('change', e => uploadInput(e));
document.getElementById('up-tpl').addEventListener('change', e => uploadInput(e));

async function uploadInput(e) {
  const files = Array.from(e.target.files || []);
  e.target.value = '';
  for (const file of files) await uploadOne(file);
}

function kindOf(file) {
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  if (ext === 'pptx' || ext === 'pdf') return { url: '/api/templates', label: 'шаблон' };
  if (['png', 'jpg', 'jpeg', 'webp', 'gif', 'svg', 'bmp'].includes(ext)) return { url: '/api/assets', label: 'изображение' };
  return null;
}

async function uploadOne(file) {
  const kind = kindOf(file);
  if (!kind) {
    note(`Файл «${file.name}» не принят: поддерживаются картинки (png/jpg/webp/gif/svg) и шаблоны .pptx`, true);
    return;
  }
  const pill = note(`⏳ Загружаю «${file.name}» как ${kind.label}…`);
  const fd = new FormData();
  fd.append('file', file);
  try {
    const r = await fetch(kind.url, { method: 'POST', body: fd });
    const res = await r.json();
    if (res.ok) {
      pill.textContent = `✅ «${res.name}» — ${kind.label} загружен. Агент видит файл через ${kind.url === '/api/assets' ? 'list_images' : 'list_templates'}.`;
    } else {
      pill.textContent = `❌ «${file.name}» не загружен: ${res.detail || 'ошибка сервера'}`;
      pill.classList.add('err');
    }
  } catch (err) {
    pill.textContent = `❌ «${file.name}» не загружен: ${err}`;
    pill.classList.add('err');
  }
  refreshFiles();
  refreshTemplates();
}

function note(text, isError) {
  const div = document.createElement('div');
  div.className = 'msg agent upload' + (isError ? ' err' : '');
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

// --- перетаскивание файлов в любое место окна ---
const dropzone = document.getElementById('dropzone');
let dragDepth = 0;
const hasFiles = e => Array.from((e.dataTransfer && e.dataTransfer.types) || []).includes('Files');

window.addEventListener('dragenter', e => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  dragDepth++;
  dropzone.classList.add('on');
});
window.addEventListener('dragover', e => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'copy';
});
window.addEventListener('dragleave', e => {
  if (!hasFiles(e)) return;
  if (--dragDepth <= 0) { dragDepth = 0; dropzone.classList.remove('on'); }
});
window.addEventListener('drop', async e => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  dragDepth = 0;
  dropzone.classList.remove('on');
  for (const file of Array.from(e.dataTransfer.files)) await uploadOne(file);
});

// --- вставка скриншота из буфера (Ctrl+V) ---
document.addEventListener('paste', async e => {
  const items = Array.from((e.clipboardData && e.clipboardData.items) || []);
  const images = items.filter(i => i.type.startsWith('image/'));
  if (!images.length) return;
  e.preventDefault();
  for (const [index, item] of images.entries()) {
    const blob = item.getAsFile();
    if (!blob) continue;
    const ext = (blob.type.split('/')[1] || 'png').replace('jpeg', 'jpg');
    const stamp = new Date().toISOString().slice(11, 19).replace(/:/g, '-');
    await uploadOne(new File([blob], `вставка-${stamp}${index ? '-' + index : ''}.${ext}`, { type: blob.type }));
  }
});

// ---------- список чатов: открыть / удалить ----------
async function refreshChats() {
  const r = await fetch('/api/sessions');
  const data = await r.json();
  const box = document.getElementById('chats');
  box.innerHTML = '';
  data.sessions.forEach(s => {
    const row = document.createElement('div');
    row.className = 'chat-item';
    const a = document.createElement('a');
    a.className = 'title';
    a.href = '/?session=' + encodeURIComponent(s.id);
    a.textContent = s.presentation || (s.preview || 'чат без сообщений');
    const del = document.createElement('button');
    del.className = 'del';
    del.title = 'Удалить чат';
    del.textContent = '🗑';
    del.onclick = async () => {
      if (!confirm('Удалить этот чат? История пропадёт (файлы презентаций останутся).')) return;
      await fetch('/api/session/' + encodeURIComponent(s.id), { method: 'DELETE' });
      if (sessionId === s.id) location.href = '/';
      else refreshChats();
    };
    row.appendChild(a);
    row.appendChild(del);
    box.appendChild(row);
  });
  if (!data.sessions.length) box.innerHTML = '<div class="hint">Пока пусто — чаты появятся после первого сообщения.</div>';
}
refreshChats();
</script>
