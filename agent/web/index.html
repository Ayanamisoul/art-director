<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Арт-директор</title>
<link rel="stylesheet" href="/static/ui.css">
<link rel="stylesheet" href="/static/style.css?v=4">
</head>
<body>
<header class="site-header">
  <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span>Арт-директор</a>
  <nav class="site-nav" aria-label="Основная навигация"><a href="/">Создать</a><a href="/workspace" aria-current="page">Чаты и лендинги</a></nav>
</header>
<div class="layout">
  <div id="dropzone">Перетащите файлы сюда<small>Изображения, шаблоны PowerPoint и PDF</small></div>
  <div class="chat">
    <h1>Рабочий чат</h1>
    <div id="focusbar"></div>
    <div id="messages" aria-label="Сообщения"><p class="empty-chat">Опишите задачу или выберите предыдущий чат из библиотеки.</p></div>
    <div class="tplrow"><label for="outformat">Формат</label><select id="outformat">
        <option value="">Авто — решает модель</option>
        <option value="presentation">Презентация (.pptx)</option>
        <option value="landing">Лендинг (сайт)</option>
      </select>
      <label id="deck-choice">Шаблон слайдов
        <select id="template"><option value="">Авто</option></select>
      </label>
      <label id="photo-choice" hidden><input type="checkbox" id="no-template-photos">Без фото из PDF</label>
      <label id="landing-choice">Образец лендинга
        <select id="landing-profile"><option value="">Авто</option></select>
      </label>
    </div>
    <form class="composer" id="form">
      <textarea id="input" rows="2" aria-label="Сообщение" placeholder="Опишите задачу или вставьте исходный текст"></textarea>
      <button id="send" type="submit">Отправить</button>
    </form>
  </div>
  <aside>
    <h2>Библиотека</h2>
    <button class="new-chat" onclick="location.href='/workspace'">Новый чат</button>
    <div class="hint">Всё сохраняется локально на этом компьютере.</div>
    <button class="upload-btn" onclick="document.getElementById('up-img').click()"> Загрузить изображение</button>
    <button class="upload-btn" onclick="document.getElementById('up-tpl').click()">Загрузить шаблон PPTX или PDF</button>
    <input type="file" id="up-img" accept="image/*" multiple hidden>
    <input type="file" id="up-tpl" accept=".pptx,.pdf" hidden>
    <h2>Чаты</h2>
    <div id="chats"></div>
    <h2>Картинки</h2>
    <div id="assets"></div>
    <h2>Файлы</h2>
    <div id="files"></div>
  </aside>
</div>
<script src="/static/app.js?v=4"></script>
</body>
</html>
