<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Арт-директор</title>
<link rel="stylesheet" href="/static/style.css?v=2">
</head>
<body>
<div class="layout">
  <div id="dropzone"> Брось файлы сюда<small>картинки → изображения для презы · .pptx → шаблон презентации</small></div>
  <div class="chat">
    <header>
      <h1>Арт-директор</h1>
      <span style="font-size:12px; color:#9a8f83">Z.ai · GLM 5.3 Flash</span>
    </header>
    <div id="focusbar"></div>
    <div id="messages"></div>
    <div class="tplrow"><span>Формат:</span><select id="outformat">
        <option value="">Авто — решает модель</option>
        <option value="presentation">Презентация (.pptx)</option>
        <option value="landing">Лендинг (сайт)</option>
      </select><span>Шаблон:</span><select id="template"><option value="">Авто — самый свежий загруженный</option></select><label style="display:flex;align-items:center;gap:4px;cursor:pointer"><input type="checkbox" id="no-template-photos" style="accent-color:var(--accent)">Без фото из шаблона</label></div>
    <form class="composer" id="form">
      <input id="input" placeholder="Например: сделай презентацию по железу для новичков по моему шаблону" autocomplete="off">
      <button id="send" type="submit">Отправить</button>
    </form>
  </div>
  <aside>
    <h2>Файлы</h2>
    <button class="new-chat" onclick="location.href='/'"> Новый чат</button>
    <div class="hint">Всё сохраняется локально на этом компьютере.</div>
    <button class="upload-btn" onclick="document.getElementById('up-img').click()"> Загрузить изображение</button>
    <button class="upload-btn" onclick="document.getElementById('up-tpl').click()"> Загрузить шаблон .pptx</button>
    <input type="file" id="up-img" accept="image/*" multiple hidden>
    <input type="file" id="up-tpl" accept=".pptx" hidden>
    <h2>Чаты</h2>
    <div id="chats"></div>
    <h2>Картинки</h2>
    <div id="assets"></div>
    <h2>Файлы</h2>
    <div id="files"></div>
  </aside>
</div>
<script src="/static/app.js?v=2"></script>
</body>
</html>
