<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кофейня «Утро»</title>
    <style>
        :root {
            --primary-color: #3E2723;
            --secondary-color: #654321;
            --accent-color: #A67C52;
            --text-color: #F5F5DC;
            --background-color: #2E1A15;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 50px 0;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        header h1 {
            font-size: 3em;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.2em;
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: var(--accent-color);
            color: var(--text-color);
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: var(--secondary-color);
        }

        .menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 50px 0;
        }

        .menu-item {
            background-color: var(--primary-color);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        .menu-item h3 {
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        .menu-item p {
            font-size: 1.2em;
            color: var(--accent-color);
        }

        .contacts {
            text-align: center;
            padding: 50px 0;
            background-color: var(--primary-color);
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        .contacts h2 {
            font-size: 2em;
            margin-bottom: 20px;
        }

        .contacts p {
            font-size: 1.2em;
            margin-bottom: 10px;
        }

        footer {
            text-align: center;
            padding: 20px 0;
            background-color: var(--secondary-color);
            border-radius: 15px;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌞 Кофейня «Утро»</h1>
            <p>Начните свой день с ароматного кофе в уютной атмосфере</p>
            <a href="#menu" class="btn">Посмотреть меню</a>
        </header>

        <section id="menu" class="menu">
            <div class="menu-item">
                <h3>Эспрессо</h3>
                <p>200₽</p>
            </div>
            <div class="menu-item">
                <h3>Латте</h3>
                <p>250₽</p>
            </div>
            <div class="menu-item">
                <h3>Капучино</h3>
                <p>230₽</p>
            </div>
            <div class="menu-item">
                <h3>Фраппучино</h3>
                <p>280₽</p>
            </div>
        </section>

        <section class="contacts">
            <h2>Контакты</h2>
            <p>📍 Москва, ул. Утренняя, 15</p>
            <p>☎️ +7 (495) 123-45-67</p>
        </section>

        <footer>
            <p>&copy; 2023 Кофейня «Утро». Все права защищены.</p>
        </footer>
    </div>
</body>
</html>
